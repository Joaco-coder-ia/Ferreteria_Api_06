server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/auth/ {
        proxy_pass http://auth-service:8080;
    }

    location /api/productos {
        proxy_pass http://catalog-service:8081;
    }

    location /api/pedidos {
        proxy_pass http://order-service:8082;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
