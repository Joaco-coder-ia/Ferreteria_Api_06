<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Contacto de Ferretería Los Maestros" />
  <title>Contacto | Ferretería Los Maestros</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <!-- Encabezado y navegación principal del sitio. -->
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Volver al inicio">
      <span class="brand-mark" aria-hidden="true">⌂</span>
      <span>
        <strong>Los Maestros</strong>
        <small>Ferretería y construcción</small>
      </span>
    </a>

    <button class="menu-button" type="button" aria-expanded="false" aria-controls="main-nav">
      ☰
      <span>Menú</span>
    </button>

    <nav id="main-nav" class="main-nav" aria-label="Navegación principal">
      <a href="index.html">Inicio</a>
      <a href="productos.html">Catálogo</a>
      <a href="productos.html#carrito" data-view="carrito">Carrito</a>
      <a href="contacto.html" aria-current="page">Contacto</a>
      <a href="index.html#cuenta" data-view="cuenta">Mi cuenta</a>
      <a href="index.html#acceso" data-view="acceso">Ingreso</a>
    </nav>
  </header>

  <main id="app" tabindex="-1">
    <!-- Formulario de contacto que será validado desde js/validaciones.js. -->
    <section id="view-contacto" class="content-section narrow">
      <div class="section-heading">
        <p class="eyebrow">Estamos para ayudarte</p>
        <h1>Contacto</h1>
        <p>Completa el formulario para registrar tu consulta.</p>
      </div>

      <form id="contact-form" class="auth-card" novalidate>
        <label for="contact-name">Nombre completo</label>
        <input id="contact-name" name="nombre" type="text" maxlength="100" required />

        <label for="contact-email">Correo electrónico</label>
        <input id="contact-email" name="correo" type="email" maxlength="100" required />

        <label for="contact-message">Comentario</label>
        <textarea id="contact-message" name="comentario" maxlength="500" required></textarea>

        <p id="contact-message-status" class="form-message" role="status" hidden></p>

        <button class="button button-primary full" type="submit">Enviar consulta</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <strong>Ferretería Los Maestros</strong>
    <span>Proyecto académico DSY1104 · EP1 Frontend</span>
    <span>La Serena, Región de Coquimbo</span>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/validaciones.js"></script>
</body>

</html>
