<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Registro en Ferretería Los Maestros" />
  <title>Registro | Ferretería Los Maestros</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="icon" href="assets/img/herramientas.svg" type="image/svg+xml" />
</head>

<body data-page="registro">
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Volver al inicio">
      <span class="brand-mark" aria-hidden="true">⌂</span>
      <span><strong>Los Maestros</strong><small>Ferretería y construcción</small></span>
    </a>
    <button class="menu-button" type="button" aria-expanded="false" aria-controls="main-nav">
      ☰ <span>Menú</span>
    </button>
    <nav id="main-nav" class="main-nav" aria-label="Navegación principal">
      <a href="index.html">Inicio</a>
      <a href="productos.html">Catálogo</a>
      <a href="carrito.html">Carrito</a>
      <a href="contacto.html">Contacto</a>
      <a href="cuenta.html">Mi cuenta</a>
      <a href="ingreso.html" aria-current="page">Ingreso</a>
    </nav>
  </header>

  <main id="app" tabindex="-1">
    <!-- Página independiente para registrar un usuario simulado. -->
    <section id="view-registro" class="view content-section narrow">
      <div class="auth-card">
        <p class="eyebrow">Nuevo cliente</p>
        <h1>Crear una cuenta</h1>

        <form id="register-form" novalidate>
          <label for="register-name">Nombre completo</label>
          <input id="register-name" required />
          <label for="register-email">Correo electrónico</label>
          <input id="register-email" type="email" required />
          <label for="register-password">Contraseña</label>
          <input id="register-password" type="password" minlength="6" required />
          <p id="register-message" class="form-message" role="status" hidden></p>
          <button class="button button-primary full" type="submit">Registrarme</button>
        </form>

        <p class="form-help">¿Ya tienes una cuenta? <a href="ingreso.html">Iniciar sesión</a></p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <strong>Ferretería Los Maestros</strong>
    <span>Proyecto académico DSY1104 · EP1 Frontend</span>
    <span>La Serena, Región de Coquimbo</span>
  </footer>

  <script src="assets/js/app.js"></script>
  <script src="assets/js/validaciones.js"></script>
</body>

</html>
